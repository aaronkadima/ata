name: Publicar ATA · Produção e Desenvolvimento

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Validar ATA desenvolvimento"]
    types: [completed]
    branches: [develop]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-ata
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter produção (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - name: Obter desenvolvimento (develop)
        uses: actions/checkout@v4
        with:
          ref: develop
          path: development

      - name: Validar estrutura e JavaScript
        run: |
          test -s production/index.html
          test -s development/index.html
          test -s development/assets/audio-editor.js
          node --check development/assets/audio-editor.js
          node --check development/assets/waveform-player.js

      - name: Montar os dois ambientes
        run: |
          mkdir -p _site/dev
          cp production/index.html production/manifest.webmanifest _site/
          cp -R production/assets _site/assets
          cp development/index.html development/manifest.webmanifest _site/dev/
          cp -R development/assets _site/dev/assets
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/dev/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empacotar páginas
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar produção e desenvolvimento
        id: deployment
        uses: actions/deploy-pages@v4
